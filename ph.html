<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="东南亚旅游与商务出行天气、机场与交通风险简易查询">

<link rel="stylesheet" href="css/style.css">

<body data-page="country" data-country="ph">

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-logo">✈</div>

    </div>
    <div class="topbar-right">

      <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">

    </div>
  </div>

<div class="shell">
  <aside class="sidebar"><nav class="nav-card" id="nav"></nav></aside>
  <main class="main" id="main"><div class="loading" data-i18n="app.loading">正在载入天气数据…</div></main>

    <h4 data-i18n="footer.disclaimerTitle">重要说明</h4>
    <p data-i18n="footer.disclaimer"></p>

    <div class="credit" data-i18n="footer.credit">每日 01:00（GMT+7）自动更新</div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/risk.js"></script>
